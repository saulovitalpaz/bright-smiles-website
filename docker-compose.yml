version: '3.8'

services:
  # Frontend Service (Vite + React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=https://api.odontoeharmonizacao.com.br
    depends_on:
      - backend

  # Backend Service (Node.js + Express)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the local environment}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the local environment}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the local environment}
    volumes:
      - ./server:/app
      - /app/node_modules

  # Redis for BullMQ (Background Jobs)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
