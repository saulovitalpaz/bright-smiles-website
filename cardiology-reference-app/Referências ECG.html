<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referência de ECG Veterinário - Sistema Dinâmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1400px;
            margin: auto;
        }
        .card {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            margin-bottom: 2rem;
        }
        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .input-wrapper {
            display: flex;
            flex-direction: column;
        }
        .input-wrapper label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #374151;
        }
        .input-wrapper select, .input-wrapper input {
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .input-wrapper select:focus, .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .table-container {
            overflow-x: auto;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
        }
        tbody tr:hover {
            background-color: #f9fafb;
        }
        .result-input {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }
        .result-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .status-normal {
            background-color: #d1fae5;
            color: #065f46;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-altered {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-warning {
            background-color: #fef3c7;
            color: #92400e;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-weight: 600;
            display: inline-block;
        }
        .example-link {
            color: #667eea;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: inline-block;
        }
        .example-link:hover {
            color: #764ba2;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
        }
        .modal-close {
            float: right;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            color: #6b7280;
        }
        .modal-close:hover {
            color: #1f2937;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="text-center mb-8">
            <h1 class="text-5xl font-bold text-white mb-2">Sistema de Referência ECG</h1>
            <p class="text-2xl text-white opacity-90">Análise Dinâmica para Cães e Gatos</p>
        </header>

        <!-- Painel de Seleção do Paciente -->
        <div class="card">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Dados do Paciente</h2>
            <div class="input-group">
                <div class="input-wrapper">
                    <label for="species">Espécie</label>
                    <select id="species" onchange="updateReferences()">
                        <option value="">Selecione...</option>
                        <option value="dog">Cão</option>
                        <option value="cat">Gato</option>
                    </select>
                </div>
                <div class="input-wrapper">
                    <label for="weight">Peso (kg)</label>
                    <input type="number" id="weight" placeholder="Ex: 25.5" step="0.1" min="0" onchange="updateReferences()">
                </div>
                <div class="input-wrapper">
                    <label for="age">Idade</label>
                    <select id="age" onchange="updateReferences()">
                        <option value="adult">Adulto</option>
                        <option value="puppy">Filhote</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tabela de Referências -->
        <div class="card">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Parâmetros Eletrocardiográficos</h2>
            <div class="table-container">
                <table id="ecgTable">
                    <thead>
                        <tr>
                            <th style="width: 20%">Parâmetro</th>
                            <th style="width: 15%">Referência</th>
                            <th style="width: 15%">Resultado</th>
                            <th style="width: 15%">Status</th>
                            <th style="width: 35%">Comentários Clínicos</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Conteúdo será gerado dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Exemplos de Traçados -->
    <div id="exampleModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // Base de dados de referências para ECG veterinário
        const ecgReferences = {
            dog: {
                adult: {
                    fc: { min: 60, max: 170, unit: 'bpm', type: 'interval' },
                    fc_tachy: { threshold: 180, unit: 'bpm', type: 'threshold_max' },
                    rhythm: { values: ['Ritmo sinusal', 'Arritmia sinusal', 'Marcapasso migratório'], type: 'qualitative' },
                    p_amplitude: { max: 0.4, unit: 'mV', type: 'max' },
                    p_duration: { max: 40, maxGiant: 50, unit: 'ms', type: 'max' },
                    pr_interval: { min: 60, max: 130, unit: 'ms', type: 'interval' },
                    qrs_duration: { max: 60, unit: 'ms', type: 'max' },
                    qrs_amplitude: { max: 3, unit: 'mV', type: 'max' },
                    qrs_axis: { min: 40, max: 100, unit: '°', type: 'interval' },
                    st_segment: { value: 'Isoelétrico', deviation: 0.2, unit: 'mV', type: 'qualitative' },
                    qt_interval: { min: 150, max: 250, unit: 'ms', type: 'interval' },
                    t_amplitude: { min: -0.05, max: 1, unit: 'mV', type: 'interval' },
                    t_polarity: { value: 'Variável (positiva/bifásica)', type: 'qualitative' }
                },
                puppy: {
                    fc: { min: 60, max: 220, unit: 'bpm', type: 'interval' },
                    fc_tachy: { threshold: 220, unit: 'bpm', type: 'threshold_max' }
                }
            },
            cat: {
                adult: {
                    fc: { min: 140, max: 220, unit: 'bpm', type: 'interval' },
                    fc_tachy: { threshold: 220, unit: 'bpm', type: 'threshold_max' },
                    rhythm: { values: ['Ritmo sinusal'], type: 'qualitative' },
                    p_amplitude: { max: 0.2, unit: 'mV', type: 'max' },
                    p_duration: { max: 35, unit: 'ms', type: 'max' },
                    pr_interval: { min: 50, max: 90, unit: 'ms', type: 'interval' },
                    qrs_duration: { max: 50, unit: 'ms', type: 'max' },
                    qrs_amplitude: { max: 0.9, unit: 'mV', type: 'max' },
                    qrs_axis: { min: 0, max: 160, unit: '°', type: 'interval' },
                    st_segment: { value: 'Isoelétrico', type: 'qualitative' },
                    qt_interval: { min: 160, max: 220, unit: 'ms', type: 'interval' },
                    t_amplitude: { min: 0.03, max: 0.3, unit: 'mV', type: 'interval' }
                }
            }
        };

        // Comentários clínicos detalhados
        const clinicalComments = {
            fc: 'Taquicardia pode ser fisiológica (exercício, estresse) ou patológica (hipovolemia, choque, febre, dor)',
            rhythm: 'Arritmia sinusal respiratória é comum e normal em cães, rara em gatos',
            p_amplitude: 'Aumentada sugere Aumento Atrial Direito (AAD) - avaliar doenças pulmonares',
            p_duration: 'Aumentada sugere Aumento Atrial Esquerdo (AAE) - avaliar doença valvar mitral',
            pr_interval: 'Prolongado: Bloqueio AV 1º grau. Curto: via acessória ou ritmo juncional',
            qrs_duration: 'Aumentado sugere bloqueio de ramo ou distúrbio de condução intraventricular',
            qrs_amplitude: 'Aumentada: AVE. Reduzida: derrame pleural/pericárdico, obesidade',
            qrs_axis: 'Desvio à direita: AVD. Desvio à esquerda: AVE ou bloqueio fascicular anterior',
            st_segment: 'Desvios indicam isquemia, miocardite ou distúrbios eletrolíticos',
            qt_interval: 'Prolongado: risco de Torsades de Pointes. Causas: fármacos, hipocalemia, hipocalcemia',
            t_amplitude: 'Apiculação simétrica alta sugere hipercalemia',
            t_polarity: 'Inversão em DII pode indicar isquemia/infarto'
        };

        // Exemplos de traçados (URLs serão atualizadas com suas imagens locais)
        const exampleImages = {
            normal_sinus: 'Exemplo de ritmo sinusal normal será carregado aqui',
            av_block_1: 'Exemplo de bloqueio AV 1º grau - intervalo PR prolongado',
            av_block_2_mobitz1: 'Exemplo de bloqueio AV 2º grau Mobitz I (Wenckebach)',
            av_block_2_mobitz2: 'Exemplo de bloqueio AV 2º grau Mobitz II',
            av_block_3: 'Exemplo de bloqueio AV 3º grau (completo)',
            rbbb: 'Exemplo de bloqueio de ramo direito (RBBB)',
            lbbb: 'Exemplo de bloqueio de ramo esquerdo (LBBB)',
            lafb: 'Exemplo de bloqueio fascicular anterior esquerdo (LAFB)',
            vpcs: 'Exemplo de complexos ventriculares prematuros (VPCs)',
            atrial_fib: 'Exemplo de fibrilação atrial'
        };

        function updateReferences() {
            const species = document.getElementById('species').value;
            const weight = parseFloat(document.getElementById('weight').value);
            const age = document.getElementById('age').value;
            
            if (!species) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="text-center text-gray-500">Selecione a espécie do paciente</td></tr>';
                return;
            }

            const refs = species === 'dog' 
                ? { ...ecgReferences.dog.adult, ...(age === 'puppy' ? ecgReferences.dog.puppy : {}) }
                : ecgReferences.cat.adult;

            let tableHTML = '';
            
            // Frequência Cardíaca
            tableHTML += createRow('Frequência Cardíaca', refs.fc, 'fc', weight);
            
            // Ritmo
            tableHTML += createRow('Ritmo Cardíaco', refs.rhythm, 'rhythm', weight);
            
            // Onda P
            tableHTML += createRow('Onda P: Amplitude (DII)', refs.p_amplitude, 'p_amplitude', weight);
            tableHTML += createRow('Onda P: Duração', refs.p_duration, 'p_duration', weight);
            
            // Intervalo PR
            tableHTML += createRow('Intervalo PR', refs.pr_interval, 'pr_interval', weight);
            
            // Complexo QRS
            tableHTML += createRow('Complexo QRS: Duração', refs.qrs_duration, 'qrs_duration', weight);
            tableHTML += createRow('Complexo QRS: Amplitude R (DII)', refs.qrs_amplitude, 'qrs_amplitude', weight);
            tableHTML += createRow('Complexo QRS: Eixo Elétrico', refs.qrs_axis, 'qrs_axis', weight);
            
            // Segmento ST
            tableHTML += createRow('Segmento ST', refs.st_segment, 'st_segment', weight);
            
            // Intervalo QT
            tableHTML += createRow('Intervalo QT', refs.qt_interval, 'qt_interval', weight);
            
            // Onda T
            tableHTML += createRow('Onda T: Amplitude', refs.t_amplitude, 't_amplitude', weight);
            if (refs.t_polarity) {
                tableHTML += createRow('Onda T: Polaridade', refs.t_polarity, 't_polarity', weight);
            }

            document.getElementById('tableBody').innerHTML = tableHTML;
            
            // Adicionar listeners para os inputs
            document.querySelectorAll('.result-input').forEach(input => {
                input.addEventListener('input', function() {
                    evaluateResult(this);
                });
            });
        }

        function createRow(paramName, refData, paramKey, weight) {
            let refText = '';
            
            if (refData.type === 'interval') {
                refText = `${refData.min}-${refData.max} ${refData.unit}`;
            } else if (refData.type === 'max') {
                if (paramKey === 'p_duration' && weight > 40) {
                    refText = `< ${refData.maxGiant || refData.max} ${refData.unit} (raça gigante)`;
                } else {
                    refText = `< ${refData.max} ${refData.unit}`;
                }
            } else if (refData.type === 'qualitative') {
                refText = Array.isArray(refData.values) ? refData.values.join(', ') : refData.value;
            } else if (refData.type === 'threshold_max') {
                refText = `Normal até ${refData.threshold} ${refData.unit}`;
            }

            const comment = clinicalComments[paramKey] || '';
            const exampleLink = hasExample(paramKey) ? `<br><span class="example-link" onclick="showExample('${paramKey}')">Ver exemplo de traçado</span>` : '';

            return `
                <tr>
                    <td><strong>${paramName}</strong></td>
                    <td>${refText}</td>
                    <td><input type="text" class="result-input" data-param="${paramKey}" data-ref='${JSON.stringify(refData)}' placeholder="Digite o valor"></td>
                    <td><span class="status-result" id="status-${paramKey}">-</span></td>
                    <td>${comment}${exampleLink}</td>
                </tr>
            `;
        }

        function evaluateResult(input) {
            const paramKey = input.dataset.param;
            const refData = JSON.parse(input.dataset.ref);
            const value = input.value.trim();
            const statusElement = document.getElementById(`status-${paramKey}`);

            if (!value) {
                statusElement.textContent = '-';
                statusElement.className = 'status-result';
                return;
            }

            let status = '';
            let className = '';

            if (refData.type === 'interval') {
                const numValue = parseFloat(value);
                if (isNaN(numValue)) {
                    status = 'Valor inválido';
                    className = 'status-warning';
                } else if (numValue >= refData.min && numValue <= refData.max) {
                    status = 'Normal';
                    className = 'status-normal';
                } else if (numValue < refData.min) {
                    status = 'Reduzido';
                    className = 'status-altered';
                } else {
                    status = 'Aumentado';
                    className = 'status-altered';
                }
            } else if (refData.type === 'max') {
                const numValue = parseFloat(value);
                if (isNaN(numValue)) {
                    status = 'Valor inválido';
                    className = 'status-warning';
                } else if (numValue < refData.max) {
                    status = 'Normal';
                    className = 'status-normal';
                } else {
                    status = 'Aumentado';
                    className = 'status-altered';
                }
            } else if (refData.type === 'qualitative') {
                const normalValues = Array.isArray(refData.values) ? refData.values : [refData.value];
                const isNormal = normalValues.some(nv => 
                    value.toLowerCase().includes(nv.toLowerCase()) || 
                    nv.toLowerCase().includes(value.toLowerCase())
                );
                status = isNormal ? 'Normal' : 'Alterado';
                className = isNormal ? 'status-normal' : 'status-altered';
            }

            statusElement.textContent = status;
            statusElement.className = `status-result ${className}`;
        }

        function hasExample(paramKey) {
            return ['pr_interval', 'qrs_duration', 'qrs_axis'].includes(paramKey);
        }

        function showExample(paramKey) {
            const modal = document.getElementById('exampleModal');
            const modalBody = document.getElementById('modalBody');
            
            let content = '<h3 class="text-2xl font-bold mb-4">Exemplos de Traçados ECG</h3>';
            
            if (paramKey === 'pr_interval') {
                content += `
                    <div class="mb-4">
                        <h4 class="text-lg font-semibold mb-2">Bloqueios Atrioventriculares</h4>
                        <p class="mb-2"><strong>BAV 1º Grau:</strong> ${exampleImages.av_block_1}</p>
                        <p class="mb-2"><strong>BAV 2º Grau Mobitz I:</strong> ${exampleImages.av_block_2_mobitz1}</p>
                        <p class="mb-2"><strong>BAV 2º Grau Mobitz II:</strong> ${exampleImages.av_block_2_mobitz2}</p>
                        <p class="mb-2"><strong>BAV 3º Grau:</strong> ${exampleImages.av_block_3}</p>
                        <p class="text-sm text-gray-600 mt-4">Imagens de referência devem ser adicionadas na pasta local. Edite as URLs no código.</p>
                    </div>
                `;
            } else if (paramKey === 'qrs_duration') {
                content += `
                    <div class="mb-4">
                        <h4 class="text-lg font-semibold mb-2">Bloqueios de Ramo e Fasciculares</h4>
                        <p class="mb-2"><strong>Bloqueio de Ramo Direito (RBBB):</strong> ${exampleImages.rbbb}</p>
                        <p class="mb-2"><strong>Bloqueio de Ramo Esquerdo (LBBB):</strong> ${exampleImages.lbbb}</p>
                        <p class="mb-2"><strong>Bloqueio Fascicular Anterior Esquerdo (LAFB):</strong> ${exampleImages.lafb}</p>
                        <p class="text-sm text-gray-600 mt-4">Imagens de referência devem ser adicionadas na pasta local. Edite as URLs no código.</p>
                    </div>
                `;
            } else if (paramKey === 'qrs_axis') {
                content += `
                    <div class="mb-4">
                        <h4 class="text-lg font-semibold mb-2">Desvios de Eixo Elétrico</h4>
                        <p class="mb-2">Desvio à esquerda frequentemente associado ao LAFB (padrão rS em D2, D3, aVF)</p>
                        <p class="mb-2">Desvio à direita pode indicar hipertrofia ventricular direita</p>
                        <p class="text-sm text-gray-600 mt-4">Adicione imagens mostrando diferentes eixos elétricos</p>
                    </div>
                `;
            }
            
            modalBody.innerHTML = content;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('exampleModal').style.display = 'none';
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('exampleModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // Inicializar com mensagem
        updateReferences();
    </script>
</body>
</html>
