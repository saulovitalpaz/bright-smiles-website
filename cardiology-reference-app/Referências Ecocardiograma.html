<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laudo Ecocardiográfico Interativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f5f9;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr:hover {
            background-color: #f7fafc;
        }
        .main-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 24px;
        }
        h1 { color: #1e293b; }
        h2 { color: #334155; }
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
        }
        .patient-result-input {
            min-width: 100px;
        }
        .status-cell {
            font-weight: bold;
            border-radius: 9999px;
            padding: 4px 12px;
            text-align: center;
            font-size: 0.85rem;
            display: inline-block;
        }
        .status-normal { background-color: #dcfce7; color: #166534; }
        .status-aumentado-leve { background-color: #fef9c3; color: #854d0e; }
        .status-aumentado-moderado { background-color: #ffedd5; color: #c2410c; }
        .status-aumentado-severo { background-color: #fee2e2; color: #991b1b; }
        .status-reduzido-leve { background-color: #fef9c3; color: #854d0e; }
        .status-reduzido-moderado { background-color: #ffedd5; color: #c2410c; }
        .status-reduzido-severo { background-color: #fee2e2; color: #991b1b; }
        .status-borderline { background-color: #e0e7ff; color: #3730a3;}
        .comment-cell {
            font-size: 0.85rem;
            color: #475569;
            min-width: 250px;
            line-height: 1.5;
        }
        .category-row td {
            background-color: #e2e8f0;
            font-weight: bold;
            color: #1e293b;
            padding-top: 10px;
            padding-bottom: 10px;
        }
        @media print {
            body { background-color: white; font-size: 9pt; -webkit-print-color-adjust: exact; print-color-adjust: exact;}
            .main-card { box-shadow: none; border: 1px solid #cbd5e0; padding: 12px; page-break-inside: avoid; }
            .no-print { display: none; }
            input, select, textarea { border: none!important; background-color: transparent!important; padding: 2px!important; -webkit-appearance: none; -moz-appearance: none; appearance: none; width: auto; }
            .patient-result-input { width: 60px; }
            textarea { width: 100%; height: auto; }
            .status-cell { border: 1px solid #ddd; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6 no-print">
            <h1 class="text-3xl font-bold">Laudo Ecocardiográfico Interativo</h1>
            <div>
                <button onclick="clearForm()" class="bg-gray-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-gray-600 transition duration-300 mr-2">Limpar</button>
                <button onclick="window.print()" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 transition duration-300">
                    Gerar PDF / Imprimir
                </button>
            </div>
        </div>

        <!-- Dados do Paciente e Tutor -->
        <div class="main-card">
            <h2 class="text-2xl font-semibold mb-4">Dados do Paciente e Tutor</h2>
            <form id="patient-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label for="patientName" class="block text-sm font-medium text-gray-700">Paciente</label>
                    <input type="text" id="patientName" name="patientName">
                </div>
                <div>
                    <label for="tutorName" class="block text-sm font-medium text-gray-700">Tutor</label>
                    <input type="text" id="tutorName" name="tutorName">
                </div>
                 <div>
                    <label for="species" class="block text-sm font-medium text-gray-700">Espécie</label>
                    <select id="species" name="species" onchange="updateAllReferences()">
                        <option value="cao">Cão</option>
                        <option value="gato">Gato</option>
                    </select>
                </div>
                <div>
                    <label for="breed" class="block text-sm font-medium text-gray-700">Raça</label>
                    <input type="text" id="breed" name="breed">
                </div>
                <div>
                    <label for="age" class="block text-sm font-medium text-gray-700">Idade</label>
                    <input type="text" id="age" name="age">
                </div>
                <div>
                    <label for="weight" class="block text-sm font-medium text-gray-700">Peso (kg)</label>
                    <input type="number" id="weight" name="weight" step="0.1" oninput="updateAllReferences()">
                </div>
                 <div>
                    <label for="hr" class="block text-sm font-medium text-gray-700">Freq. Cardíaca (bpm)</label>
                    <input type="number" id="hr" name="hr">
                </div>
                <div>
                    <label for="examDate" class="block text-sm font-medium text-gray-700">Data do Exame</label>
                    <input type="date" id="examDate" name="examDate" class="p-2 border rounded-lg w-full">
                </div>
            </form>
        </div>

        <!-- Tabela de Parâmetros -->
        <div class="main-card table-container">
            <h2 class="text-2xl font-semibold mb-4">Câmaras Cardíacas, Grandes Vasos e Parâmetros Hemodinâmicos</h2>
            <table id="eco-table">
                <thead>
                    <tr>
                        <th>Parâmetro</th>
                        <th>Referência</th>
                        <th>Resultado</th>
                        <th>Análise</th>
                        <th class="comment-cell">Comentários Clínicos</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <div class="mt-4">
                 <label for="conclusion-camaras" class="block text-sm font-medium text-gray-700">Conclusões - Câmaras Cardíacas:</label>
                 <textarea id="conclusion-camaras" name="conclusion-camaras" rows="3" class="w-full mt-1" placeholder="Ex: Hipertrofia concêntrica do VE, remodelamento de câmaras direitas..."></textarea>
            </div>
        </div>

        <!-- Valvas Cardíacas -->
        <div class="main-card">
            <h2 class="text-2xl font-semibold mb-4">Valvas Cardíacas</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Mitral -->
                <div>
                    <h3 class="font-bold text-lg mb-2 text-gray-800">Mitral</h3>
                    <div class="space-y-2">
                        <div>
                            <label class="text-sm font-medium text-gray-600">Morfologia:</label>
                            <input type="text" name="mitral_morf" class="mt-1" placeholder="Ex: Folhetos espessados...">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Movimentação:</label>
                             <input type="text" name="mitral_mov" class="mt-1" placeholder="Ex: Prolapso sistólico...">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Função:</label>
                             <input type="text" name="mitral_func" class="mt-1" placeholder="Ex: Regurgitação branda...">
                        </div>
                    </div>
                </div>
                <!-- Aórtica -->
                <div>
                    <h3 class="font-bold text-lg mb-2 text-gray-800">Aórtica</h3>
                     <div class="space-y-2">
                        <div>
                            <label class="text-sm font-medium text-gray-600">Morfologia:</label>
                            <input type="text" name="aortica_morf" class="mt-1" value="Folhetos normais">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Movimentação:</label>
                             <input type="text" name="aortica_mov" class="mt-1" value="Normal">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Função:</label>
                             <input type="text" name="aortica_func" class="mt-1">
                        </div>
                    </div>
                </div>
                <!-- Tricúspide -->
                <div>
                    <h3 class="font-bold text-lg mb-2 text-gray-800">Tricúspide</h3>
                     <div class="space-y-2">
                        <div>
                            <label class="text-sm font-medium text-gray-600">Morfologia:</label>
                            <input type="text" name="tricuspide_morf" class="mt-1">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Movimentação:</label>
                             <input type="text" name="tricuspide_mov" class="mt-1" value="Normal">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Função:</label>
                             <input type="text" name="tricuspide_func" class="mt-1">
                        </div>
                    </div>
                </div>
                <!-- Pulmonar -->
                <div>
                    <h3 class="font-bold text-lg mb-2 text-gray-800">Pulmonar</h3>
                     <div class="space-y-2">
                        <div>
                            <label class="text-sm font-medium text-gray-600">Morfologia:</label>
                            <input type="text" name="pulmonar_morf" class="mt-1" value="Normal">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Movimentação:</label>
                             <input type="text" name="pulmonar_mov" class="mt-1" value="Normal">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-600">Função:</label>
                             <input type="text" name="pulmonar_func" class="mt-1" value="Fluxo laminar">
                        </div>
                    </div>
                </div>
            </div>
             <div class="mt-6">
                 <label for="conclusion-valvas" class="block text-sm font-medium text-gray-700">Conclusões - Valvas Cardíacas:</label>
                 <textarea id="conclusion-valvas" name="conclusion-valvas" rows="3" class="w-full mt-1" placeholder="Ex: Degeneração mixomatosa da valva mitral..."></textarea>
            </div>
        </div>
        
        <!-- Informações Adicionais e Conclusão Final -->
        <div class="main-card">
            <h2 class="text-2xl font-semibold mb-4">Informações Complementares e Conclusão</h2>
             <div>
                 <label for="info-comp" class="block text-sm font-medium text-gray-700">Informações Complementares:</label>
                 <textarea id="info-comp" name="info-comp" rows="3" class="w-full mt-1" placeholder="Ex: Espaço pleural e pericárdico sem alterações..."></textarea>
            </div>
            <div class="mt-4">
                 <label for="conclusion-final" class="block text-sm font-medium text-gray-700">Impressão Diagnóstica / Conclusão Final:</label>
                 <textarea id="conclusion-final" name="conclusion-final" rows="6" class="w-full mt-1" placeholder="Descreva aqui o resumo final do laudo..."></textarea>
            </div>
        </div>

    </div>

    <script>
        const ecoParameters = {
            // MODO-M E 2D: VENTRÍCULO ESQUERDO
            'LVDd': {
                label: 'VE Diâmetro Diástole (mm)',
                unit: 'mm',
                category: 'Modo-M e 2D: Ventrículo Esquerdo e Átrio Esquerdo',
                ref: {
                    cao: (peso) => {
                        if (!peso || peso <= 0) return 'Insira o peso';
                        const lower = (1.17 * Math.pow(peso, 0.322)) * 10;
                        const upper = (1.63 * Math.pow(peso, 0.322)) * 10;
                        return `${lower.toFixed(1)} - ${upper.toFixed(1)}`;
                    },
                    gato: (peso) => '13.0 - 18.9'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Avalia o tamanho da câmara no relaxamento. Aumento sugere sobrecarga de volume (hipertrofia excêntrica).'
            },
            'LVDs': {
                label: 'VE Diâmetro Sístole (mm)',
                unit: 'mm',
                category: 'Modo-M e 2D: Ventrículo Esquerdo e Átrio Esquerdo',
                ref: {
                    cao: (peso) => {
                         if (!peso || peso <= 0) return 'Insira o peso';
                        const lower = (0.70 * Math.pow(peso, 0.346)) * 10;
                        const upper = (1.09 * Math.pow(peso, 0.346)) * 10;
                        return `${lower.toFixed(1)} - ${upper.toFixed(1)}`;
                    },
                    gato: (peso) => '7.4 - 11.4'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Mede o tamanho da câmara na contração. Aumento indica disfunção sistólica.'
            },
            'IVSd': {
                label: 'Septo Interventricular Diástole (mm)',
                unit: 'mm',
                category: 'Modo-M e 2D: Ventrículo Esquerdo e Átrio Esquerdo',
                ref: {
                    cao: (peso) => {
                        if (!peso || peso <= 0) return 'Insira o peso';
                        const lower = (0.27 * Math.pow(peso, 0.289)) * 10;
                        const upper = (0.49 * Math.pow(peso, 0.289)) * 10;
                        return `${lower.toFixed(1)} - ${upper.toFixed(1)}`;
                    },
                    gato: (peso) => '2.7 - 5.7'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Aumento (hipertrofia septal) pode indicar sobrecarga de pressão esquerda (estenose subaórtica, HAS) ou cardiomiopatia hipertrófica.'
            },
             'LVWd': {
                label: 'Parede Livre VE Diástole (mm)',
                unit: 'mm',
                category: 'Modo-M e 2D: Ventrículo Esquerdo e Átrio Esquerdo',
                ref: {
                    cao: (peso) => {
                        if (!peso || peso <= 0) return 'Insira o peso';
                        const lower = (0.30 * Math.pow(peso, 0.261)) * 10;
                        const upper = (0.53 * Math.pow(peso, 0.261)) * 10;
                        return `${lower.toFixed(1)} - ${upper.toFixed(1)}`;
                    },
                    gato: (peso) => '2.3 - 5.7'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Aumento (hipertrofia de parede livre) sugere sobrecarga de pressão, como hipertensão sistêmica.'
            },
             'LAAo': {
                label: 'Relação Átrio Esquerdo/Aorta (LA/Ao)',
                unit: '',
                category: 'Modo-M e 2D: Ventrículo Esquerdo e Átrio Esquerdo',
                ref: {
                    cao: (peso) => '< 1.6',
                    gato: (peso) => '< 1.5'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'upper'),
                comment: 'Principal indicador do tamanho do átrio esquerdo. Aumentado em sobrecargas de volume ou disfunção diastólica.'
            },
            // FUNÇÃO SISTÓLICA VE
            'FS': {
                label: 'Fração de Encurtamento (%)',
                unit: '%',
                category: 'Função Sistólica - Ventrículo Esquerdo',
                ref: {
                    cao: (peso) => '> 25',
                    gato: (peso) => '> 28'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: 'Índice da função sistólica (contratilidade). Valores reduzidos indicam insuficiência miocárdica.'
            },
            'EF_teich': {
                label: 'Fração de Ejeção - Teichholz (%)',
                unit: '%',
                category: 'Função Sistólica - Ventrículo Esquerdo',
                ref: {
                    cao: (peso) => '> 50',
                    gato: (peso) => '> 60'
                },
                 analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: 'Percentual de sangue ejetado a cada batimento. Pode superestimar em VE com geometria anormal.'
            },
             'EF_simp': {
                label: 'Fração de Ejeção - Simpson (%)',
                unit: '%',
                category: 'Função Sistólica - Ventrículo Esquerdo',
                ref: {
                    cao: (peso) => '> 55',
                    gato: (peso) => '> 60'
                },
                 analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: 'Método mais acurado para FE, especialmente com WMA. Principal índice da função sistólica global.'
            },
             'MAPSE': {
                label: 'MAPSE (cm)',
                unit: 'cm',
                category: 'Função Sistólica - Ventrículo Esquerdo',
                ref: {
                    cao: (peso) => '> 1.0',
                    gato: (peso) => '> 0.8'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: 'Excursão Sistólica do Anel Mitral. Mede a função longitudinal do VE. Reduzido na disfunção sistólica.'
            },
            'EPSS': {
                label: 'Distância E-Septo (EPSS) (mm)',
                unit: 'mm',
                category: 'Função Sistólica - Ventrículo Esquerdo',
                ref: {
                    cao: (peso) => '< 6.5',
                    gato: (peso) => '< 5.0'
                },
                 analysis: (val, refStr) => analyzeValue(val, refStr, 'upper'),
                comment: 'Aumentado na disfunção sistólica com dilatação do VE. Reflete a pobre excursão da valva mitral.'
            },
             // MODO-M E 2D: CÂMARAS DIREITAS
            'RVDd': {
                label: 'VD Diâmetro Diástole (mm)',
                unit: 'mm',
                category: 'Modo-M e 2D: Câmaras Direitas',
                 ref: {
                    cao: (peso) => {
                        if (!peso || peso <= 0) return 'Insira o peso';
                        const val = (0.41 * Math.pow(peso, 0.33)) * 10;
                        const lower = val * 0.8;
                        const upper = val * 1.2;
                        return `${lower.toFixed(1)} - ${upper.toFixed(1)}`;
                    },
                    gato: (peso) => '4.0 - 9.0'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Avalia o tamanho do VD. Aumento sugere sobrecarga de volume/pressão direita (ex: hipertensão pulmonar, displasia de tricúspide).'
            },
            'RVFWd': {
                label: 'Parede Livre VD Diástole (mm)',
                unit: 'mm',
                category: 'Modo-M e 2D: Câmaras Direitas',
                ref: {
                    cao: (peso) => '< 5.0',
                    gato: (peso) => '< 4.0'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'upper'),
                comment: 'Aumento (hipertrofia) indica sobrecarga de pressão no VD, como estenose pulmonar ou hipertensão pulmonar crônica.'
            },
            // FUNÇÃO SISTÓLICA VD
            'TAPSE': {
                label: 'TAPSE (mm)',
                unit: 'mm',
                category: 'Função Sistólica - Ventrículo Direito',
                 ref: {
                    cao: (peso) => {
                        if (!peso || peso <= 0) return '> 8';
                        if (peso < 10) return '> 6.0';
                        if (peso < 30) return '> 8.0';
                        return '> 10.0';
                    },
                    gato: (peso) => '> 5.0'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: 'Excursão Sistólica do Anel Tricúspide. Mede a função longitudinal do VD. Reduzido na disfunção sistólica direita.'
            },
            'RVFAC': {
                label: 'FAC do VD (%)',
                unit: '%',
                category: 'Função Sistólica - Ventrículo Direito',
                ref: {
                    cao: (peso) => '> 35',
                    gato: (peso) => '> 35'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: 'Mudança Fracional da Área do VD. Indicador global da função sistólica direita. Menos dependente do ângulo que o TAPSE.'
            },
            's_wave_tdi': {
                label: "Onda S' Tricúspide (TDI) (cm/s)",
                unit: 'cm/s',
                category: 'Função Sistólica - Ventrículo Direito',
                ref: {
                    cao: (peso) => '> 9.5',
                    gato: (peso) => '> 10.0'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: 'Velocidade sistólica do anel tricúspide. Medida sensível da função contrátil longitudinal do VD.'
            },
             // DOPPLER: FLUXOS E GRANDES VASOS
            'aorticVmax': {
                label: 'Fluxo Aórtico - Vmáx (m/s)',
                unit: 'm/s',
                category: 'Doppler: Fluxos e Grandes Vasos',
                ref: {
                    cao: (peso) => '< 1.7',
                    gato: (peso) => '< 1.7'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'upper'),
                comment: 'Aumentada em estenose subaórtica ou estados hiperdinâmicos (anemia, febre).'
            },
            'pulmonicVmax': {
                label: 'Fluxo Pulmonar - Vmáx (m/s)',
                unit: 'm/s',
                category: 'Doppler: Fluxos e Grandes Vasos',
                ref: {
                    cao: (peso) => '< 1.4',
                    gato: (peso) => '< 1.6'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'upper'),
                comment: 'Aumentada em estenose pulmonar ou aumento de fluxo (shunt E-D).'
            },
             'APAo': {
                label: 'Relação Diâmetro AP/Ao',
                unit: '',
                category: 'Doppler: Fluxos e Grandes Vasos',
                ref: {
                    cao: (peso) => '0.8 - 1.2',
                    gato: (peso) => '0.9 - 1.1'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Aumentada em dilatação pós-estenótica (estenose pulmonar) ou hipertensão pulmonar.'
            },
            // DOPPLER: FUNÇÃO DIASTÓLICA VE
            'mitralE': {
                label: 'Fluxo Mitral - Onda E (m/s)',
                unit: 'm/s',
                category: 'Doppler: Função Diastólica VE',
                ref: {
                    cao: (peso) => '0.6 - 1.0',
                    gato: (peso) => '0.5 - 0.9'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Enchimento ventricular rápido. Baixa na alteração de relaxamento, alta no padrão restritivo.'
            },
            'mitralA': {
                label: 'Fluxo Mitral - Onda A (m/s)',
                unit: 'm/s',
                category: 'Doppler: Função Diastólica VE',
                ref: {
                    cao: (peso) => '0.4 - 0.7',
                    gato: (peso) => '0.4 - 0.7'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Contração atrial. Aumenta em relação à onda E na alteração de relaxamento.'
            },
             'mitralEA': {
                label: 'Relação E/A',
                unit: '',
                category: 'Doppler: Função Diastólica VE',
                ref: {
                    cao: (peso) => '1.0 - 2.0',
                    gato: (peso) => '1.0 - 1.8'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: '< 1 sugere alteração do relaxamento (Grau I); > 2 sugere padrão restritivo (Grau III).'
            },
             'TD_E': {
                label: 'Tempo de Desaceleração Onda E (ms)',
                unit: 'ms',
                category: 'Doppler: Função Diastólica VE',
                ref: {
                    cao: (peso) => '60 - 100',
                    gato: (peso) => '50 - 90'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Prolongado na alteração de relaxamento; encurtado (<60ms) no padrão restritivo.'
            },
            'TRIV': {
                label: 'Tempo de Relaxamento Isovolumétrico (ms)',
                unit: 'ms',
                category: 'Doppler: Função Diastólica VE',
                ref: {
                    cao: (peso) => '40 - 75',
                    gato: (peso) => '35 - 60'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr),
                comment: 'Prolongado (>75ms) na alteração de relaxamento; encurtado (<40ms) no padrão restritivo.'
            },
            'e_wave_tdi': {
                label: "Onda e' lateral (TDI) (cm/s)",
                unit: 'cm/s',
                category: 'Doppler: Função Diastólica VE',
                ref: {
                    cao: (peso) => '> 8.0',
                    gato: (peso) => '> 9.0'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: "Velocidade de relaxamento do anel mitral. Reduzida (<8 cm/s) na disfunção diastólica, independente da pré-carga."
            },
            'E_e_ratio': {
                label: "Relação E/e'",
                unit: '',
                category: 'Doppler: Função Diastólica VE',
                ref: {
                    cao: (peso) => '< 8',
                    gato: (peso) => '< 9'
                },
                analysis: (val, refStr) => {
                    if (val === '' || val === null) return { statusClass: '', text: '' };
                    const numericValue = parseFloat(val);
                    if (isNaN(numericValue)) return { statusClass: '', text: '' };
                    if (numericValue < 8) return { statusClass: 'status-normal', text: 'Normal' };
                    if (numericValue <= 15) return { statusClass: 'status-borderline', text: 'Zona Cinzenta' };
                    return { statusClass: 'status-aumentado-severo', text: 'Elevado' };
                },
                comment: 'Estimativa da pressão de enchimento do AE. <8 Normal; 8-15 Indeterminado; >15 Pressões elevadas.'
            },
            'SD_ratio_pv': {
                label: 'Fluxo Venoso Pulmonar (S/D)',
                unit: '',
                category: 'Doppler: Função Diastólica VE',
                ref: {
                    cao: (peso) => '> 1',
                    gato: (peso) => '> 1'
                },
                analysis: (val, refStr) => analyzeValue(val, refStr, 'lower'),
                comment: 'Relação fluxo sistólico/diastólico. Inverte-se (<1) quando a pressão do AE aumenta (Disfunção Grau II/III).'
            }
        };

        function analyzeValue(value, refString, boundType = 'range') {
            if (value === '' || value === null || !refString || refString.includes('Insira') || refString.includes('Varia') || refString.includes('Comparar')) {
                return { statusClass: '', text: '' };
            }
            const numericValue = parseFloat(value);
            if (isNaN(numericValue)) {
                return { statusClass: '', text: '' };
            }

            let lowerBound, upperBound;
            
            if (boundType === 'range') {
                [lowerBound, upperBound] = refString.split(' - ').map(parseFloat);
            } else if (boundType === 'lower') {
                lowerBound = parseFloat(refString.replace('>', '').trim());
                upperBound = Infinity;
            } else if (boundType === 'upper') {
                upperBound = parseFloat(refString.replace('<', '').trim());
                lowerBound = -Infinity;
            }

            if (isNaN(lowerBound) || isNaN(upperBound)) {
                 return { statusClass: '', text: '' };
            }
            
            let range = upperBound - lowerBound;
            if (!isFinite(range)) {
                range = Math.abs(isFinite(lowerBound) ? lowerBound : upperBound);
            }

            if (numericValue >= lowerBound && numericValue <= upperBound) {
                return { statusClass: 'status-normal', text: 'Normal' };
            } else if (numericValue > upperBound) {
                const diff = (numericValue - upperBound) / (range * 0.5 || upperBound * 0.5) ;
                if (diff < 0.20) return { statusClass: 'status-aumentado-leve', text: 'Aumentado (Leve)' };
                if (diff < 0.40) return { statusClass: 'status-aumentado-moderado', text: 'Aumentado (Moderado)' };
                return { statusClass: 'status-aumentado-severo', text: 'Aumentado (Severo)' };
            } else { // numericValue < lowerBound
                 const diff = (lowerBound - numericValue) / (range * 0.5 || lowerBound * 0.5) ;
                if (diff < 0.20) return { statusClass: 'status-reduzido-leve', text: 'Reduzido (Leve)' };
                if (diff < 0.40) return { statusClass: 'status-reduzido-moderado', text: 'Reduzido (Moderado)' };
                return { statusClass: 'status-reduzido-severo', text: 'Reduzido (Severo)' };
            }
        }
        
        function populateTable() {
            const tableBody = document.getElementById('eco-table').getElementsByTagName('tbody')[0];
            tableBody.innerHTML = '';
            let currentCategory = '';

            for (const key in ecoParameters) {
                const param = ecoParameters[key];

                if (param.category !== currentCategory) {
                    currentCategory = param.category;
                    const categoryRow = tableBody.insertRow();
                    categoryRow.className = 'category-row';
                    categoryRow.innerHTML = `<td colspan="5">${currentCategory}</td>`;
                }
                
                const row = tableBody.insertRow();
                row.id = `row-${key}`;

                row.innerHTML = `
                    <td>${param.label}</td>
                    <td id="ref-${key}" class="ref-cell font-mono"></td>
                    <td><input type="number" id="result-${key}" class="patient-result-input" step="any" oninput="updateAnalysis('${key}')"></td>
                    <td id="analysis-${key}" class="analysis-cell"></td>
                    <td class="comment-cell">${param.comment}</td>
                `;
            }
        }
        
        function updateAnalysis(key) {
            const param = ecoParameters[key];
            const resultInput = document.getElementById(`result-${key}`);
            const refCell = document.getElementById(`ref-${key}`);
            const analysisCell = document.getElementById(`analysis-${key}`);
            
            const analysis = param.analysis(resultInput.value, refCell.textContent);
            
            analysisCell.innerHTML = `<span class="status-cell ${analysis.statusClass}">${analysis.text}</span>`;
        }

        function updateAllReferences() {
            const weight = parseFloat(document.getElementById('weight').value);
            const species = document.getElementById('species').value;

            for (const key in ecoParameters) {
                const param = ecoParameters[key];
                const refCell = document.getElementById(`ref-${key}`);
                
                if (param.ref && param.ref[species]) {
                    refCell.textContent = param.ref[species](weight);
                } else {
                     refCell.textContent = 'N/A';
                }
                updateAnalysis(key);
            }
        }
        
        function clearForm(){
            document.getElementById('patient-form').reset();
            const textInputs = document.querySelectorAll('.main-card input[type="text"], .main-card textarea');
            textInputs.forEach(input => input.value = '');
             for (const key in ecoParameters) {
                const resultInput = document.getElementById(`result-${key}`);
                if(resultInput) resultInput.value = '';
            }
            document.getElementById('examDate').valueAsDate = new Date();
            updateAllReferences();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('examDate').valueAsDate = new Date();
            populateTable();
            updateAllReferences();
        });

    </script>
